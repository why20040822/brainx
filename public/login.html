<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Brain X</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
<main class="login-card" aria-labelledby="login-title">
  <h1 id="login-title" class="login-brand">Brain X</h1>
  <p class="login-sub">职位决策工作台 · 本地版</p>

  <!-- 正式入口：飞书网页授权，身份=飞书账号，按 open_id 匹配顾问花名册 -->
  <div id="oauth-block" hidden>
    <a class="btn btn-primary btn-block" id="oauth-btn" href="/api/v1/oauth/authorize"
       style="display:block;text-align:center;text-decoration:none;line-height:28px">使用飞书账号登录</a>
    <p class="login-foot muted">仅限 TTC 交易团队顾问（花名册见 consultants 表）· 数据保存在本机 data/brainx.db</p>
  </div>

  <!-- 未配置 app_secret 时的管理员提示 -->
  <div id="setup-block" hidden>
    <p class="error-text">飞书登录未配置</p>
    <p class="muted" style="font-size:13.5px">管理员在终端执行后重启服务：<br>
    <code>export BRAINX_FEISHU_APP_SECRET=…（从 1Password 读取）</code></p>
  </div>

  <!-- 开发者后门（BRAINX_DEV_AUTH=1）：离线演示用的身份选择器 -->
  <form id="login-form" hidden>
    <fieldset>
      <legend>演示模式 · 选择身份进入：</legend>
      <div id="consultant-list" role="radiogroup" aria-label="顾问列表"></div>
    </fieldset>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn" disabled>进 入 工 作 台</button>
  </form>

  <p class="error-text" id="login-error" role="alert" hidden></p>
</main>
<script type="module">
const errEl = document.getElementById('login-error');
const ERROR_TEXT = {
  bad_state: '登录状态校验失败，请重试',
  no_code: '飞书未返回授权码',
  exchange_failed: '飞书身份交换失败，请重试',
  not_in_roster: '你的飞书账号不在顾问花名册中，请联系 Mia 开通',
};
const params = new URLSearchParams(location.search);
if (params.get('error')) {
  errEl.hidden = false;
  errEl.textContent = ERROR_TEXT[params.get('error')] || '登录失败，请重试';
}

const st = await (await fetch('/api/v1/oauth/status')).json();
if (st.configured) {
  document.getElementById('oauth-block').hidden = false;
} else if (!st.dev_auth) {
  document.getElementById('setup-block').hidden = false;
}
if (st.dev_auth) {
  // 演示模式：保留原选择器
  const form = document.getElementById('login-form');
  form.hidden = false;
  const list = document.getElementById('consultant-list');
  const btn = document.getElementById('login-btn');
  let selected = null;
  const r = await fetch('/api/v1/consultants');
  const d = await r.json();
  for (const c of d.items || []) {
    const label = document.createElement('label');
    label.className = 'consultant-option';
    label.innerHTML = `<input type="radio" name="consultant" value="${c.consultant_id}">
      <span>${c.display_name || c.consultant_id}</span>`;
    label.querySelector('input').addEventListener('change', (e) => {
      selected = e.target.value; btn.disabled = false;
    });
    list.appendChild(label);
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selected) return;
    const r = await fetch('/api/v1/session', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ consultant_id: selected }),
    });
    if (r.status === 204) { location.href = '/'; return; }
    errEl.hidden = false;
    errEl.textContent = '登录失败，请重试';
  });
}
</script>
</body>
</html>
