# BrainX CI —— 每次 push / PR 到 main 时跑：
#  1) 后端测试门禁（177 用例必须全绿才能合并）
#  2) 前端构建校验（vinext build 不能挂）
#  3) Docker 镜像可构建校验（保证部署产物始终可打包）
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支新推送会取消上一次仍在跑的 CI，省额度、拿最新结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 后端测试门禁 ----------
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - name: Install backend deps
        run: npm install --no-audit --no-fund
      - name: Run test suite (177 用例)
        run: npm test

  # ---------- 前端构建校验 ----------
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: frontend/btex-frontend/package-lock.json
      - name: Install frontend deps
        run: npm --prefix frontend/btex-frontend install --no-audit --no-fund
      - name: Build frontend (vinext)
        run: npm run build

  # ---------- Docker 构建校验（仅构建，不推送）----------
  docker-build:
    runs-on: ubuntu-latest
    # 测试与前端构建都过了才验证镜像，避免浪费构建时长
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: brainx:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
